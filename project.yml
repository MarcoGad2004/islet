name: Islet
options:
  bundleIdPrefix: com.marcogad
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: L4Y6A9NY9T   # stable signature so Accessibility/Camera grants survive rebuilds
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Islet:
    type: application
    platform: macOS
    sources:
      - Sources/Islet
      - path: Models/FaceEmbedding.mlmodel   # fetched by scripts/fetch-model.sh, not in git
        optional: true
      - path: Models/AntiSpoof.mlpackage   # MiniFASNet, built by scripts/convert-antispoof.py, in git
        optional: true
    info:
      path: Sources/Islet/Info.plist
      properties:
        CFBundleName: Dynamic Peninsula
        CFBundleDisplayName: Dynamic Peninsula
        CFBundleShortVersionString: "1.4"
        CFBundleVersion: "144"
        LSUIElement: true   # menu-bar/agent app, no Dock icon
        NSLocationWhenInUseUsageDescription: "Dynamic Peninsula reads nearby Wi-Fi network names for the Wi-Fi control."
        NSBluetoothAlwaysUsageDescription: "Dynamic Peninsula lists and connects your Bluetooth devices from the notch."
        NSAppleEventsUsageDescription: "Dynamic Peninsula toggles Dark Mode through System Events."
        NSContactsUsageDescription: "Dynamic Peninsula shows the names of the people messaging you."
        NSCameraUsageDescription: "Dynamic Peninsula uses the camera to recognise you for face unlock."
        NSHumanReadableCopyright: "Copyright © 2026 Marcorios Gad"
    postBuildScripts:
      - name: Build media adapter
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-mediaremote.sh" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
      - name: Label test builds
        basedOnDependencyAnalysis: false
        inputFiles:   # after Xcode has written the Info.plist, which would otherwise wipe the label
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          "$SRCROOT/scripts/stamp-build.sh" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    entitlements:
      path: Sources/Islet/Islet.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: true
        com.apple.security.device.bluetooth: true
        com.apple.security.personal-information.location: true
        com.apple.security.personal-information.addressbook: true   # Contacts: without it the hardened runtime denies silently
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.marcogad.islet   # never changes: permissions, the Keychain and settings hang on it
        PRODUCT_NAME: Dynamic Peninsula   # the app's name since 1.5 (name only; the code and repo are still Islet)
        PRODUCT_MODULE_NAME: Islet
  IsletTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/IsletTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Dynamic Peninsula.app/Contents/MacOS/Dynamic Peninsula"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Islet
schemes:
  # Written out since the 1.5 rename: Xcode's automatic scheme stopped picking up the tests once the product was no
  # longer called Islet.
  Islet:
    build:
      targets:
        Islet: all
        IsletTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IsletTests
    archive:
      config: Release
